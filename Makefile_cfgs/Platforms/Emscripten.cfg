# =============================================================================
# Emscripten Platform Configuration (Final Fix)
# =============================================================================

CXX = emcc
CC = emcc
STRIP = true
PKGCONFIG = true
NAME = rsdkv4.js

# -----------------------------------------------------------------------------
# Compiler Flags
# -----------------------------------------------------------------------------
# -DRETRO_PLATFORM=4: Forces Linux logic (Standard SDL2/Ogg paths)
# -DRETRO_SDL_VERSION=2: Tells the engine we are using SDL2
# -DASIO_DISABLE_THREADS: Disables networking threading (Fixes "Only Windows/POSIX" error)
# -s USE_SDL=2: Enables SDL2 in Emscripten
# -I...: Manually include dependencies
# --include ...: Force-include headers to prevent "unknown type" errors

CFLAGS += -O3 -std=c++17 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -DASIO_DISABLE_THREADS \
    -DASIO_STANDALONE \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# -----------------------------------------------------------------------------
# Linker Flags
# -----------------------------------------------------------------------------

LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EXIT_RUNTIME=0
