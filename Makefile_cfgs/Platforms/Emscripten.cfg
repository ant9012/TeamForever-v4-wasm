# =============================================================================
# Emscripten Platform Configuration (With Video Support)
# =============================================================================

CXX = emcc
CC = emcc
STRIP = true
PKGCONFIG = true
NAME = rsdkv4.js

# -----------------------------------------------------------------------------
# Compiler Flags
# -----------------------------------------------------------------------------
# -I./dependencies/libtheora/include: Fixes "fatal error: theora/theoradec.h not found"
# -s EMULATE_FUNCTION_POINTER_CASTS=1: Prevents crashes in Theora code

CFLAGS += -O3 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -DRETRO_USING_SDL2=1 \
    -DASIO_DISABLE_THREADS \
    -DASIO_STANDALONE \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -include SDL2/SDL.h \
    -include ogg/ogg.h \
    -include vorbis/vorbisfile.h \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -I./dependencies/libtheora/include \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# C++ Only Flags
CXXFLAGS += -std=c++17

# -----------------------------------------------------------------------------
# Source Files (Video Decoding)
# -----------------------------------------------------------------------------
# We manually compile the Theora library source files here.

SOURCES += dependencies/libtheora/lib/bitpack \
           dependencies/libtheora/lib/decinfo \
           dependencies/libtheora/lib/decode \
           dependencies/libtheora/lib/fragment \
           dependencies/libtheora/lib/huffdec \
           dependencies/libtheora/lib/idct \
           dependencies/libtheora/lib/info \
           dependencies/libtheora/lib/internal \
           dependencies/libtheora/lib/quant \
           dependencies/libtheora/lib/state

# -----------------------------------------------------------------------------
# Linker Flags
# -----------------------------------------------------------------------------

LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -s EXIT_RUNTIME=0
