# =============================================================================
# Emscripten Platform Configuration (Fixed)
# =============================================================================

CXX = emcc
CC = emcc
STRIP = true

# Disable pkg-config to prevent "sdl2: No such file" errors
PKGCONFIG = true

NAME = rsdkv4.js

# -----------------------------------------------------------------------------
# Compiler Flags (Applied to CFLAGS because the Makefile uses CFLAGS for C++)
# -----------------------------------------------------------------------------
# -DRETRO_PLATFORM=4: Force Linux logic (Fixes Sint16/Window/Android errors)
# -DASIO_DISABLE_THREADS: Fixes "Only Windows and POSIX" networking error
# -s USE_SDL=2: Tells Emscripten to enable SDL2 support during compilation
# -I...: Manual include paths for dependencies

CFLAGS += -O3 -std=c++17 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -DASIO_DISABLE_THREADS \
    -DASIO_STANDALONE \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# -----------------------------------------------------------------------------
# Linker Flags
# -----------------------------------------------------------------------------

LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EXIT_RUNTIME=0
