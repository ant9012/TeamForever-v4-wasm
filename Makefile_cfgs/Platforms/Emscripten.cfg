CXX = emcc
CC = emcc
STRIP = true
PKGCONFIG = true
NAME = rsdkv4.js

# Compiler Flags
# -Wno-shift-negative-value: Silences Theora warnings
# -s EMULATE_FUNCTION_POINTER_CASTS=1: REQUIRED for Theora to work in Wasm
CFLAGS += -O3 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -DRETRO_USING_SDL2=1 \
    -DASIO_DISABLE_THREADS \
    -DASIO_STANDALONE \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -include SDL2/SDL.h \
    -include ogg/ogg.h \
    -include vorbis/vorbisfile.h \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -I./dependencies/libtheora/include \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-shift-negative-value \
    -Wno-format

# C++ Flags
CXXFLAGS += -std=c++17

# Linker Flags
# -s INITIAL_MEMORY=268435456: Allocates 256MB RAM
LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s INITIAL_MEMORY=268435456 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -s EXIT_RUNTIME=0
