CXX = emcc
CC = emcc
STRIP = true
PKGCONFIG = true
NAME = RSDKv4.js

# -----------------------------------------------------------------------------
# Compiler Flags
# -----------------------------------------------------------------------------
# Added: -s USE_SDL_IMAGE=1 (Matches RSDKv3)
# Added: -DRETRO_USING_OPENGL=0 (Matches RSDKv3)

CFLAGS += -O3 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -DRETRO_USING_SDL2=1 \
    -DRETRO_USING_OPENGL=0 \
    -DASIO_DISABLE_THREADS \
    -DASIO_STANDALONE \
    -s USE_SDL=2 \
    -s USE_SDL_IMAGE=1 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -pthread \
    -include SDL2/SDL.h \
    -include ogg/ogg.h \
    -include vorbis/vorbisfile.h \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -I./dependencies/libtheora/include \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# C++ Flags
CXXFLAGS += -std=c++17

# -----------------------------------------------------------------------------
# Linker Flags (The Critical Fixes)
# -----------------------------------------------------------------------------
# -lidbfs.js: Links the IDBFS library (REQUIRED for FS sync with Pthreads)
# -s FORCE_FILESYSTEM=1: Ensures FS support isn't optimized away
# -lm: Links Math library

LIBS += -O3 \
    dependencies/libtheora/lib/.libs/libtheoradec.a \
    -s USE_SDL=2 \
    -s USE_SDL_IMAGE=1 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s INITIAL_MEMORY=268435456 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall','IDBFS'] \
    -s EXPORTED_FUNCTIONS="['_main', '_RSDK_Initialize', '_RSDK_Configure']" \
    -s EMULATE_FUNCTION_POINTER_CASTS=1 \
    -s EXIT_RUNTIME=0 \
    -s INVOKE_RUN=0 \
    -s FORCE_FILESYSTEM=1 \
    -lidbfs.js \
    -lm \
    -pthread \
    -s PTHREAD_POOL_SIZE=4
