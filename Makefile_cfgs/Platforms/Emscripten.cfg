# =============================================================================
# Emscripten Platform Configuration
# =============================================================================

# 1. Force Emscripten Compilers
CXX = emcc
CC = emcc
STRIP = true

# 2. NEUTRALIZE PKG-CONFIG (CRITICAL FIX)
# The main Makefile runs `$(PKGCONFIG) ...`.
# By setting this to 'true', the command runs but outputs nothing.
# This prevents "sdl2: No such file" errors.
PKGCONFIG = true

# 3. Output Name
# Must match what rsdk-library-fork expects
NAME = rsdkv4.js

# 4. Compiler Flags
# -DRETRO_PLATFORM=4: Tricks engine into using Linux logic (fixes Sint16/window errors)
# -s USE_SDL=2: Tells Emscripten to use its internal SDL2 port
# -I...: We manually add includes because we disabled pkg-config
CXXFLAGS += -O3 -std=c++17 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# 5. Linker Flags
# Enables the Virtual Filesystem (FS) and standard shell options
LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EXIT_RUNTIME=0
