# =============================================================================
# Emscripten Platform Configuration for TeamForever
# =============================================================================

# Force Emscripten Compiler
CXX = emcc
CC = emcc
STRIP = true

# NEUTRALIZE pkg-config
# The main Makefile tries to run pkg-config to get include paths.
# We set it to 'echo' so it returns nothing, preventing build errors.
PKGCONFIG = echo

# Output Name (Required for rsdk-library-fork)
NAME = rsdkv4.js

# -----------------------------------------------------------------------------
# Compiler Flags
# -----------------------------------------------------------------------------
# -DRETRO_PLATFORM=4: Forces Linux logic. This is CRITICAL. 
#    It ensures the engine includes SDL2 and Ogg headers correctly.
# -Wno-macro-redefined: Silences warnings about us forcing the Platform ID.
# -I...: Manually include dependencies since we disabled pkg-config.

CXXFLAGS += -O3 -std=c++17 -fsigned-char \
    -DRETRO_PLATFORM=4 \
    -DRETRO_SDL_VERSION=2 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -I./dependencies/all/tinyxml2 \
    -I./dependencies/all/theoraplay \
    -Wno-macro-redefined \
    -Wno-shift-op-parentheses \
    -Wno-format

# -----------------------------------------------------------------------------
# Linker Flags
# -----------------------------------------------------------------------------
# These flags allow the Web Library to inject the Data.rsdk file.

LIBS += -O3 \
    -s USE_SDL=2 \
    -s USE_OGG=1 \
    -s USE_VORBIS=1 \
    -s ALLOW_MEMORY_GROWTH=1 \
    -s ASSERTIONS=0 \
    -s EXPORT_NAME='Module' \
    -s MODULARIZE=0 \
    -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
    -s EXIT_RUNTIME=0
