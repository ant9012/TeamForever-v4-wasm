name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Build LibTheora (Pthreads + Static)
        run: |
          wget https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz
          tar -xf libtheora-1.1.1.tar.gz
          mv libtheora-1.1.1 dependencies/libtheora

          cd dependencies/libtheora
          wget -O config.guess 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess;hb=HEAD'
          wget -O config.sub 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=HEAD'

          # Force Pthreads here too
          export CFLAGS="-s USE_OGG=1 -O3 -pthread"
          export LDFLAGS="-s USE_OGG=1 -pthread"
          
          emconfigure ./configure --disable-asm --disable-examples --disable-spec --disable-shared --enable-static --disable-encode
          emmake make -j$(nproc)

      - name: Fix Dependency Paths
        run: |
          XML_SRC=$(dirname $(find dependencies -name "tinyxml2.h" | head -n 1))
          mkdir -p dependencies/all/tinyxml2
          cp -r $XML_SRC/* dependencies/all/tinyxml2/ 2>/dev/null || true
          
          THEORA_SRC=$(dirname $(find dependencies -name "theoraplay.h" | head -n 1))
          mkdir -p dependencies/all/theoraplay
          cp -r $THEORA_SRC/* dependencies/all/theoraplay/ 2>/dev/null || true

      - name: Inject JS Bridge (main.cpp)
        run: |
          cat >> RSDKv4/main.cpp <<EOF
          #ifdef __EMSCRIPTEN__
          #include <emscripten.h>
          extern "C" {
              void EMSCRIPTEN_KEEPALIVE RSDK_Configure(int value, int type) {
                  if (type == 1) {
                      Engine.gameDeviceType = (value == 1) ? 1 : 0;
                      Engine.gamePlatform = (value == 1) ? "MOBILE" : "STANDARD";
                  }
              }
              void EMSCRIPTEN_KEEPALIVE RSDK_Initialize() { main(0, NULL); }
          }
          #endif
          EOF

      - name: Patch Makefile and Headers
        run: |
          sed -i 's/INCLUDES += $(LIBS)/# INCLUDES += $(LIBS)/' Makefile
          sed -i 's/#define RETRO_PLATFORM   (RETRO_WIN)/#ifndef RETRO_PLATFORM\n#define RETRO_PLATFORM (RETRO_WIN)\n#endif/' RSDKv4/RetroEngine.hpp
          sed -i 's/#include "Windows.h"//' RSDKv4/main.cpp

      - name: Build Engine (Force Pthreads)
        run: |
          # We use environment variables to FORCE these flags, ignoring the Makefile if it tries to strip them.
          export EMCC_CFLAGS="-pthread -s USE_SDL=2 -s USE_OGG=1 -s USE_VORBIS=1"
          
          # We add the PTHREAD_POOL_SIZE here to ensure the worker is generated.
          export EMCC_LDFLAGS="-pthread -s PTHREAD_POOL_SIZE=4 -s INITIAL_MEMORY=268435456 -s ALLOW_MEMORY_GROWTH=1 -s EXPORTED_FUNCTIONS=\"['_main', '_RSDK_Initialize', '_RSDK_Configure']\" -s INVOKE_RUN=0"
          
          emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir output
          cp bin/Emscripten/rsdkv4.js output/
          cp bin/Emscripten/rsdkv4.wasm output/
          
          # We explicitly check for the worker file now.
          if [ -f "bin/Emscripten/rsdkv4.worker.js" ]; then
            cp bin/Emscripten/rsdkv4.worker.js output/
            echo "Worker file found and copied."
          else
            echo "::error::Worker file NOT found! Pthreads build failed."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
