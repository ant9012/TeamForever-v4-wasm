name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Install Dependencies
        run: |
          # 1. Download LibTheora (Source)
          # We download the source so we can compile it directly into the engine
          wget https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz
          tar -xf libtheora-1.1.1.tar.gz
          
          # 2. Place it in dependencies/libtheora
          mkdir -p dependencies
          mv libtheora-1.1.1 dependencies/libtheora

          # 3. Fix TinyXML2 path (for Mod API)
          XML_SRC=$(dirname $(find dependencies -name "tinyxml2.h" | head -n 1))
          mkdir -p dependencies/all/tinyxml2
          cp -r $XML_SRC/* dependencies/all/tinyxml2/ 2>/dev/null || true
          
          # 4. Fix TheoraPlay path (Video Player logic)
          THEORA_SRC=$(dirname $(find dependencies -name "theoraplay.h" | head -n 1))
          mkdir -p dependencies/all/theoraplay
          cp -r $THEORA_SRC/* dependencies/all/theoraplay/ 2>/dev/null || true

      - name: Patch Makefile (Linker Fix)
        # Prevents "linker input unused" warnings
        run: sed -i 's/INCLUDES += $(LIBS)/# INCLUDES += $(LIBS)/' Makefile

      - name: Build
        run: emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir output
          cp bin/Emscripten/rsdkv4.js output/
          cp bin/Emscripten/rsdkv4.wasm output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
