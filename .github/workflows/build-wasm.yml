name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Build Engine
        run: |
          emmake make PLATFORM=Emscripten \
            LDFLAGS="-pthread -lidbfs.js -s FORCE_FILESYSTEM=1 -s PTHREAD_POOL_SIZE=4 -s INITIAL_MEMORY=268435456 -s ALLOW_MEMORY_GROWTH=1 -s EMULATE_FUNCTION_POINTER_CASTS=1 -s EXPORTED_RUNTIME_METHODS=FS,callMain,cwrap,ccall,IDBFS -s EXPORTED_FUNCTIONS=_main,_RSDK_Initialize,_RSDK_Configure -s INVOKE_RUN=0 -s EXPORT_NAME=Module -s MODULARIZE=0" \
            -j$(nproc)

      - name: Fix Dependency Paths
        run: |
          XML_SRC=$(dirname $(find dependencies -name "tinyxml2.h" | head -n 1))
          mkdir -p dependencies/all/tinyxml2
          cp -r $XML_SRC/* dependencies/all/tinyxml2/ 2>/dev/null || true
          
          THEORA_SRC=$(dirname $(find dependencies -name "theoraplay.h" | head -n 1))
          mkdir -p dependencies/all/theoraplay
          cp -r $THEORA_SRC/* dependencies/all/theoraplay/ 2>/dev/null || true

      - name: Patch Makefile and Headers
        run: |
          # Clean linker flags to stop warnings
          sed -i 's/INCLUDES += $(LIBS)/# INCLUDES += $(LIBS)/' Makefile
          
          # Force Platform ID 4 (Linux logic for SDL2)
          sed -i 's/#define RETRO_PLATFORM   (RETRO_WIN)/#ifndef RETRO_PLATFORM\n#define RETRO_PLATFORM (RETRO_WIN)\n#endif/' RSDKv4/RetroEngine.hpp
          
          # Remove Windows.h if it still exists (Safety check)
          sed -i 's/#include "Windows.h"//' RSDKv4/main.cpp

      - name: Build Engine (Force Pthreads)
        run: |
          # 1. Force Compiler Flags (Pthreads + Headers)
          # We use env vars to override the Makefile logic if needed.
          export CFLAGS="-pthread -O3 -s USE_SDL=2 -s USE_SDL_IMAGE=1 -s USE_OGG=1 -s USE_VORBIS=1 -I./dependencies/libtheora/include"
          
          # 2. Force Linker Flags (Pthreads + Worker Generation)
          # PTHREAD_POOL_SIZE is what triggers the creation of the .worker.js file.
          export LDFLAGS="-pthread -lidbfs.js -s FORCE_FILESYSTEM=1 -lm -s PTHREAD_POOL_SIZE=4 -s INITIAL_MEMORY=268435456 -s ALLOW_MEMORY_GROWTH=1 -s EXPORTED_FUNCTIONS=\"['_main', '_RSDK_Initialize', '_RSDK_Configure']\" -s INVOKE_RUN=0"
          
          # 3. Run Make
          emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Check for Worker File
        run: |
          if [ -f "bin/Emscripten/RSDKv4.worker.js" ]; then
            echo "SUCCESS: Worker file generated."
          else
            echo "ERROR: Worker file MISSING. Check linker flags."
            exit 1
          fi

      - name: Prepare Artifacts
        run: |
          mkdir output
          cp bin/Emscripten/RSDKv4.js output/
          cp bin/Emscripten/RSDKv4.wasm output/
          cp bin/Emscripten/RSDKv4.worker.js output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
