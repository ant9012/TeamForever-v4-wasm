name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Fix Dependency Paths
        run: |
          # 1. Fix TinyXML2
          XML_SRC=$(dirname $(find dependencies -name "tinyxml2.h" | head -n 1))
          mkdir -p dependencies/all/tinyxml2
          cp -r $XML_SRC/* dependencies/all/tinyxml2/ 2>/dev/null || true
          
          # 2. Fix TheoraPlay
          THEORA_SRC=$(dirname $(find dependencies -name "theoraplay.h" | head -n 1))
          mkdir -p dependencies/all/theoraplay
          cp -r $THEORA_SRC/* dependencies/all/theoraplay/ 2>/dev/null || true

      - name: Patch Source Code
        run: |
          # 1. Fix SDL Include Path
          # The code likely uses <SDL.h> or <SDL/SDL.h>. Emscripten strictly needs <SDL2/SDL.h>.
          # We use sed to replace the include line in RetroEngine.hpp
          sed -i 's|<SDL.h>|<SDL2/SDL.h>|g' RSDKv4/RetroEngine.hpp
          sed -i 's|<SDL/SDL.h>|<SDL2/SDL.h>|g' RSDKv4/RetroEngine.hpp

          # 2. Patch Platform ID Override
          # Force the code to accept our command-line defined Platform ID (4)
          sed -i 's/#define RETRO_PLATFORM   (RETRO_WIN)/#ifndef RETRO_PLATFORM\n#define RETRO_PLATFORM (RETRO_WIN)\n#endif/' RSDKv4/RetroEngine.hpp

          # 3. Patch Makefile to remove broken Linker flag passing
          sed -i 's/INCLUDES += $(LIBS)/# INCLUDES += $(LIBS)/' Makefile

      - name: Verify Config
        run: |
          if [ ! -f Makefile_cfgs/Platforms/Emscripten.cfg ]; then
            echo "::error::Emscripten.cfg is missing! Please create it in Makefile_cfgs/Platforms/"
            exit 1
          fi

      - name: Build
        run: |
          # Run make. We use 'emmake' to set up the compiler environment.
          emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir output
          cp bin/Emscripten/rsdkv4.js output/
          cp bin/Emscripten/rsdkv4.wasm output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
