name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Patch and Compile
        run: |
          mkdir dist
          
          # --- STEP 1: PATCH HEADER ---
          # Your Makefile allows platform detection, BUT RSDKv4/RetroEngine.hpp 
          # often hardcodes RETRO_WIN on line 84. We must patch this to force Web (5).
          sed -i 's/#define RETRO_PLATFORM   (RETRO_WIN)/#define RETRO_PLATFORM   (5)/' RSDKv4/RetroEngine.hpp
          
          # --- STEP 2: DEFINE INCLUDES ---
          # Based exactly on the "INCLUDES" section of your Makefile
          INCLUDES="-I. \
            -I./RSDKv4 \
            -I./RSDKv4/NativeObjects \
            -I./dependencies/all/asio/asio/include \
            -I./dependencies/all/stb-image \
            -I./dependencies/all/tinyxml2 \
            -I./dependencies/all/theoraplay"

          # --- STEP 3: DEFINE SOURCES ---
          # 1. All RSDKv4 engine files
          SOURCES=$(find RSDKv4 -name "*.cpp")
          
          # 2. Dependencies listed in your Makefile's "SOURCES" variable
          # We add tinyxml2.cpp so the Mod API works
          SOURCES="$SOURCES dependencies/all/tinyxml2/tinyxml2.cpp"
          
          # 3. Theoraplay (Video support) - Find .c or .cpp
          SOURCES="$SOURCES $(find dependencies/all/theoraplay -name "theoraplay.c*" -o -name "theoraplay.cpp*")"

          # --- STEP 4: DEFINE FLAGS ---
          # Based on your Makefile flags + Emscripten requirements
          FLAGS="-O3 \
            -std=c++17 \
            -fsigned-char \
            -DRETRO_PLATFORM=5 \
            -DRETRO_SDL_VERSION=2 \
            -DRETRO_USE_MOD_LOADER=1 \
            -s USE_SDL=2 \
            -s USE_OGG=1 \
            -s USE_VORBIS=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ASSERTIONS=0 \
            -s EXPORT_NAME='Module' \
            -s MODULARIZE=0 \
            -s EXPORTED_RUNTIME_METHODS=['FS','callMain','cwrap','ccall'] \
            -Wno-macro-redefined \
            -Wno-format"

          # --- STEP 5: COMPILE ---
          echo "Compiling TeamForever..."
          emcc $SOURCES $INCLUDES $FLAGS -o dist/rsdkv4.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: dist/
