name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Install Dependencies
        run: |
          # 1. Download LibTheora
          wget https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz
          tar -xf libtheora-1.1.1.tar.gz
          mkdir -p dependencies
          mv libtheora-1.1.1 dependencies/libtheora
          
          # 2. Fix Paths for Makefile
          XML_SRC=$(dirname $(find dependencies -name "tinyxml2.h" | head -n 1))
          mkdir -p dependencies/all/tinyxml2
          cp -r $XML_SRC/* dependencies/all/tinyxml2/ 2>/dev/null || true
          
          THEORA_SRC=$(dirname $(find dependencies -name "theoraplay.h" | head -n 1))
          mkdir -p dependencies/all/theoraplay
          cp -r $THEORA_SRC/* dependencies/all/theoraplay/ 2>/dev/null || true

      - name: Patch Makefile (Inject Theora Sources)
        run: |
          # Define the COMPLETE list of Theora C files needed for decoding
          # Added: decapiwrapper (Critical API), apiwrapper (Just in case)
          THEORA_FILES="dependencies/libtheora/lib/bitpack dependencies/libtheora/lib/decinfo dependencies/libtheora/lib/decode dependencies/libtheora/lib/fragment dependencies/libtheora/lib/huffdec dependencies/libtheora/lib/idct dependencies/libtheora/lib/info dependencies/libtheora/lib/internal dependencies/libtheora/lib/quant dependencies/libtheora/lib/state dependencies/libtheora/lib/decapiwrapper dependencies/libtheora/lib/apiwrapper"
          
          # Inject them into the SOURCES list in the Makefile
          sed -i "s|dependencies/all/tinyxml2/tinyxml2|dependencies/all/tinyxml2/tinyxml2 $THEORA_FILES|" Makefile

          # Remove broken Linker flag passing
          sed -i 's/INCLUDES += $(LIBS)/# INCLUDES += $(LIBS)/' Makefile

      - name: Build
        run: |
          # Clean previous objects to force recompilation of Theora
          rm -rf obj/Emscripten
          
          # Build
          emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir output
          cp bin/Emscripten/rsdkv4.js output/
          cp bin/Emscripten/rsdkv4.wasm output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
