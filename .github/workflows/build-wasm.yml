name: Build TeamForever Wasm

on:
  push:
    branches: [ "foreve" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.53'

      - name: Verify Config Exists
        run: |
          if [ ! -f Makefile_cfgs/Platforms/Emscripten.cfg ]; then
            echo "Error: Emscripten.cfg not found in Makefile_cfgs/Platforms/"
            exit 1
          fi

      - name: Build
        run: |
          # We define PLATFORM=Emscripten so the Makefile loads our new cfg file.
          # We use emmake to ensure environment variables are set correctly.
          emmake make PLATFORM=Emscripten -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir output
          # The Makefile outputs to bin/Emscripten/
          cp bin/Emscripten/rsdkv4.js output/
          cp bin/Emscripten/rsdkv4.wasm output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsdk-wasm-output
          path: output/
